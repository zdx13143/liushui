*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}

.tabs button{
  flex:1;border:0;background:transparent;font-size:14px;font-family:inherit;
  padding:7px 0;border-radius:9px;color:var(--muted);font-weight:500;cursor:pointer;
}

  font-family:inherit;padding:13px;border-radius:12px;cursor:pointer;text-align:center;
}
.btn:active{opacity:.85}
.btn.sec{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn.sm{padding:9px;font-size:14px}
.btn.gray{background:#eceef1;color:var(--text)}

textarea{min-height:88px;resize:vertical;font-size:14px}

label.fld span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.drop{
  border:1.5px dashed var(--border);border-radius:var(--r);padding:26px 16px;text-align:center;

.drop.on{border-color:var(--accent);background:var(--accent-soft)}

.metric .lb{font-size:11.5px;color:var(--muted)}

/* ===================== 通用工具 ===================== */
function buildRules(){
  var out=[];
  RULE_TEXT.split("\n").forEach(function(line){
    line=line.trim(); if(!line) return;
    var p=line.split(":"); if(p.length<2) return;
    var cat=p[0].trim(), kws=p.slice(1).join(":").split(",");
    kws.forEach(function(k){ k=k.trim().toLowerCase(); if(k) out.push({cat:cat,kw:k}); });
  });
  out.sort(function(a,b){ return b.kw.length-a.kw.length; });
  return out;
}
var RULES = buildRules();

function decodeBytes(buf){
  var u8 = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  try{
    var s = new TextDecoder("utf-8",{fatal:true}).decode(u8);
    if(s.indexOf("\uFFFD")<0 && !/[\u0000-\u0008]/.test(s)) return s;
  }catch(e){}
  try{ return new TextDecoder("gbk").decode(u8); }catch(e){}
  try{ return new TextDecoder("gb18030").decode(u8); }catch(e){}
  return new TextDecoder("utf-8").decode(u8);
}

function parseCSV(text){
  var rows=[],row=[],cur="",q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    }else{
      if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=""; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(c!=='\r') cur+=c;
    }
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(x){ return String(x).trim()!==""; }); });
}

function money(v){
  var s=String(v==null?"":v).replace(/[¥￥,\s]/g,"").replace("元","");
  var n=parseFloat(s);
  return isNaN(n)?0:Math.abs(n);
}

function findHeader(rows, keys){
  for(var i=0;i<Math.min(rows.length,40);i++){
    var r=rows[i]; if(!r) continue;
    var joined=r.join("|");
    var hit=0;
    keys.forEach(function(k){ if(joined.indexOf(k)>=0) hit++; });
    if(hit>=Math.max(2,Math.ceil(keys.length*0.6))) return i;
  }
  return -1;
}

function mapRow(headers, row){
  var o={};
  headers.forEach(function(h,i){ o[h]=String(row[i]==null?"":row[i]).trim(); });
  return o;
}

function pick(o, names){
  for(var i=0;i<names.length;i++){ if(o[names[i]]!=null && o[names[i]]!=="") return o[names[i]]; }
  return "";
}

function parseTime(s){
  s=String(s||"").trim().replace(/\//g,"-");
  var m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})[T\s](\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if(!m) return 0;
  var d=new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0));
  return isNaN(d.getTime())?0:d.getTime();
}
function two(n){ return n<10?"0"+n:""+n; }
function ymd(ts){ var d=new Date(ts); return d.getFullYear()+"-"+two(d.getMonth()+1)+"-"+two(d.getDate()); }
function ym(ts){ var d=new Date(ts); return d.getFullYear()+"-"+two(d.getMonth()+1); }
function fmt(n){
  var s=Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");
  return s;
}

/* ===================== 账单解析 ===================== */
function detectSource(headers){
  var j=headers.join("|");
  if(j.indexOf("收/付款方式")>=0 || j.indexOf("交易分类")>=0 || j.indexOf("交易订单号")>=0) return "alipay";
  if(j.indexOf("支付方式")>=0 || j.indexOf("交易单号")>=0 || j.indexOf("当前状态")>=0) return "wechat";
  return null;
}

function parseBillText(text, sourceHint, fileName){
  var rows=parseCSV(text);
  var hi=findHeader(rows,["交易时间","收/支","金额","交易对方"]);
  if(hi<0) return {err:"没找到表头行，确认这是微信或支付宝官方导出的账单"};
  var headers=rows[hi].map(function(h){ return String(h).trim().replace(/^\uFEFF/,""); });
  var src = sourceHint || detectSource(headers);
  if(!src) src = /alipay|支付宝|alipay_record/i.test(fileName||"") ? "alipay" : "wechat";

  var out=[];
  for(var i=hi+1;i<rows.length;i++){
    var o=mapRow(headers, rows[i]);
    var ts=parseTime(pick(o,["交易时间"]));
    if(!ts) continue;
    var dirRaw=pick(o,["收/支","收支"]);
    var dir = dirRaw==="支出" ? "expense" : (dirRaw==="收入" ? "income" : "neutral");
    var amt = money(pick(o,["金额","金额(元)","金额（元）"]));
    if(!amt) continue;
    var type = pick(o,["交易类型","交易分类"]);
    var cp   = pick(o,["交易对方"]);
    var prod = pick(o,["商品","商品说明","商品名称"]);
    var st   = pick(o,["当前状态","交易状态"]);
    var oid  = pick(o,["交易单号","交易订单号","交易号","订单号"]);
    var rec = {
      src: src,
      oid: (oid && oid!=="/") ? oid : "",
      ts: ts,
      type: type,
      cp: cp,
      prod: prod,
      dir: dir,
      amt: amt,
      method: pick(o,["支付方式","收/付款方式"]),
      status: st,
      remark: pick(o,["备注"]),
      cat: "",
      ai: false
    };
    rec.id = src+"|"+(rec.oid || (ymd(ts)+"|"+rec.amt+"|"+rec.cp+"|"+rec.prod));
    out.push(rec);
  }
  return {rows:out, src:src};
}

function parseXlsx(buf, fileName){
  var wb=XLSX.read(buf,{type:"array"});
  var ws=wb.Sheets[wb.SheetNames[0]];
  var rows=XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false,raw:false});
  rows=rows.map(function(r){ return (r||[]).map(function(c){ return String(c==null?"":c).trim(); }); });
  var hi=findHeader(rows,["交易时间","收/支","金额","交易对方"]);
  if(hi<0) return {err:"没找到表头行，确认这是微信官方导出的账单"};
  var headers=rows[hi];
  var src=detectSource(headers)||"wechat";
  var out=[];
  for(var i=hi+1;i<rows.length;i++){
    var o=mapRow(headers, rows[i]);
    var ts=parseTime(pick(o,["交易时间"]));
    if(!ts) continue;
    var dirRaw=pick(o,["收/支","收支"]);
    var dir = dirRaw==="支出" ? "expense" : (dirRaw==="收入" ? "income" : "neutral");
    var amt = money(pick(o,["金额(元)","金额（元）","金额"]));
    if(!amt) continue;
    var oid = pick(o,["交易单号","交易订单号","交易号"]);
    var rec = {
      src: src, oid: (oid&&oid!=="/")?oid:"", ts: ts,
      type: pick(o,["交易类型","交易分类"]),
      cp: pick(o,["交易对方"]), prod: pick(o,["商品","商品说明"]),
      dir: dir, amt: amt,
      method: pick(o,["支付方式","收/付款方式"]),
      status: pick(o,["当前状态","交易状态"]),
      remark: pick(o,["备注"]), cat:"", ai:false
    };
    rec.id = src+"|"+(rec.oid || (ymd(ts)+"|"+rec.amt+"|"+rec.cp+"|"+rec.prod));
    out.push(rec);
  }
  return {rows:out, src:src};
}

/* ===================== 分类 ===================== */
function hitKeyword(text){
  for(var i=0;i<RULES.length;i++){
    if(text.indexOf(RULES[i].kw)>=0) return RULES[i];
  }
  return null;
}

function classify(rec){
  if(rec.cat && rec.catLocked) return rec.cat;
  var t=(rec.cp+" "+rec.prod+" "+rec.type+" "+rec.remark).toLowerCase();

  if(rec.dir==="income"){
    if(/退款|退回|已退/.test(rec.type+rec.prod+rec.status)) return "退款返还";
    if(/工资|薪|劳务|奖金|报销/.test(t)) return "工资薪酬";
    if(/红包/.test(t)) return "红包收入";
    if(/收益|利息|分红|理财|基金|余额宝|零钱通/.test(t)) return "理财收益";
    if(/转账|收款|亲属卡/.test(t)) return "转账收入";
    return "其他收入";
  }

  /* 支付宝自带交易分类，可信度很高 */
  var preset = (rec.type||"").trim();
  if(rec.src==="alipay" && EXPENSE_CATS.indexOf(preset)>=0) return preset;

  if(/退款|已退/.test(rec.status)) return "退款返还";

  var h=hitKeyword(t);
  if(h){
    if(rec.dir==="expense") return EXPENSE_CATS.indexOf(h.cat)>=0 ? h.cat : "其他支出";
    return INCOME_CATS.indexOf(h.cat)>=0 ? h.cat : "其他收入";
  }
  return rec.dir==="expense" ? "其他支出" : "其他收入";
}

/* 中性流水判定：提现、充值、还款等资金搬家 */
function isNeutral(rec){
  var t=(rec.type+" "+rec.cp+" "+rec.prod);
  for(var i=0;i<NEUTRAL_TYPES.length;i++){ if(t.indexOf(NEUTRAL_TYPES[i])>=0) return true; }
  return false;
}
function isTransfer(rec){
  var t=(rec.type+" "+rec.cp+" "+rec.prod);
  for(var i=0;i<TRANSFER_TYPES.length;i++){ if(t.indexOf(TRANSFER_TYPES[i])>=0) return true; }
  return false;
}
function isRefunded(rec){
  for(var i=0;i<REFUND_STATUS.length;i++){ if((rec.status||"").indexOf(REFUND_STATUS[i])>=0) return true; }
  return false;
}
function isInvalid(rec){
  for(var i=0;i<INVALID_STATUS.length;i++){ if((rec.status||"").indexOf(INVALID_STATUS[i])>=0) return true; }
  return false;
}

/* 参与统计的流水（受设置开关控制） */
function countable(rec, opt){
  if(rec.dir==="neutral") return false;
  if(opt.hideInvalid && isInvalid(rec)) return false;
  if(opt.hideRefund && isRefunded(rec)) return false;
  if(opt.hideTransfer && isTransfer(rec)) return false;
  if(opt.hideNeutral && isNeutral(rec)) return false;
  return true;
}

if(typeof module!=="undefined"){ module.exports={classify:classify,parseBillText:parseBillText,decodeBytes:decodeBytes,money:money,parseTime:parseTime,countable:countable,RULES:RULES}; }

function allMonths(){

  h+='<div class="card" style="margin-top:12px"><h2>怎么导出账单</h2>'

function onFiles(files){
  var arr=Array.prototype.slice.call(files||[]);
  if(!arr.length) return;
  staging={rows:[],files:0,bad:[]};
  var jobs=arr.map(function(f){ return handleOne(f); });
  Promise.all(jobs).then(function(){
    if(!staging.rows.length){ toast(staging.bad[0]||"没能解析出账单记录"); return; }
    finishImport();
  });
}

function readU8(f){ return f.arrayBuffer().then(function(b){ return new Uint8Array(b); }); }

function handleOne(f){
  return readU8(f).then(function(u8){
    var name=(f.name||"").toLowerCase();
    if(name.indexOf(".zip")>=0) return handleZip(u8,f.name);
    return handleBill(u8,f.name);
  }).catch(function(e){ staging.bad.push((f.name||"文件")+" 读取失败"); });
}

function handleBill(u8,name){
  var low=name.toLowerCase();
  var res;
  if(low.indexOf(".xlsx")>=0 || low.indexOf(".xls")>=0){
    res = (typeof XLSX==="undefined") ? {err:"表格解析库没加载出来，检查网络"} : parseXlsx(u8,name);
  }else{
    res = parseBillText(decodeBytes(u8), null, name);
  }
  if(res.err){ staging.bad.push(name+"："+res.err); return; }
  if(!res.rows || !res.rows.length){ staging.bad.push(name+"：没有交易记录"); return; }
  staging.files++;
  staging.rows=staging.rows.concat(res.rows);
}

function handleZip(u8,name){
  if(typeof fflate==="undefined"){ staging.bad.push("压缩库没加载出来，检查网络"); return Promise.resolve(); }
  var entries=null;
  try{ entries=fflate.unzipSync(u8); }catch(e){}
  if(entries && hasBill(entries)) return extractAll(entries,name);
  return askPassword().then(function(pwd){
    if(pwd===null) return;
    try{ entries=fflate.unzipSync(u8,{password:pwd}); }
    catch(e){ try{ entries=fflate.unzipSync(u8,{password:new TextEncoder().encode(pwd)}); }catch(e2){ entries=null; } }
    if(!entries){ staging.bad.push(name+"：解压失败，密码可能不对"); return; }
    return extractAll(entries,name);
  });
}
function hasBill(e){
  return Object.keys(e||{}).some(function(k){ return /\.(csv|xlsx|xls)$/i.test(k) && e[k].length>50; });
}
function extractAll(entries,name){
  var ks=Object.keys(entries).filter(function(k){ return /\.(csv|xlsx|xls)$/i.test(k) && entries[k].length>50; });
  if(!ks.length){ staging.bad.push(name+"：压缩包里没有账单文件"); return; }
  ks.forEach(function(k){
    var inner=entries[k];
    var bname=k.replace(/^.*[\\\/]/,"");
    handleBill(inner, bname);
  });
}
function askPassword(){
  return new Promise(function(res){
    var m=document.createElement("div"); m.className="mask";
    m.innerHTML='<div class="modal"><div style="font-size:15px;font-weight:600;margin-bottom:6px">输入解压密码</div>'
      +'<div class="hint" style="margin-bottom:10px">账单压缩包是加密的。微信的密码在「微信支付」公众号推给你的消息里，支付宝的在邮件正文里。</div>'
      +'<input id="pwd" placeholder="解压密码" autocomplete="off">'
      +'<div class="row" style="margin-top:12px"><button class="btn sec sm" onclick="document.querySelector(\'.mask\').remove();window.__pwd=null">取消</button>'
      +'<button class="btn sm" id="okp">解压</button></div></div>';
    document.body.appendChild(m);
    var inp=m.querySelector("#pwd");
    function done(v){ m.remove(); res(v); }
    m.querySelector("#okp").onclick=function(){ done(inp.value.trim()||""); };
    inp.onkeydown=function(e){ if(e.key==="Enter") done(inp.value.trim()||""); };
    inp.focus();
  });
}

function finishImport(){
  var seen={}; var add=0, dup=0;
  staging.rows.forEach(function(r){
    if(seen[r.id]) return;
    if(S.recs.some(function(x){ return x.id===r.id; })){ dup++; return; }
    seen[r.id]=1;
    r.cat=classify(r);
    S.recs.push(r); add++;
  });
  S.recs.sort(function(a,b){ return b.ts-a.ts; });
  save();
  staging=null;
  toast("导入 "+add+" 笔"+(dup?"，跳过重复 "+dup+" 笔":""));
  go("list");
}

/* ===================== 明细 ===================== */
function filtered(){

function mbar(){

function pickMonth(){

function viewList(){

  var exp=0,inc=0;

  var h=mbar();
  h+='<div class="metric">'
    +'<div><div class="lb">支出</div><div class="vl exp">'+fmt(exp)+'</div></div>'

    +'<div><div class="lb">结余</div><div class="vl">'+fmt(inc-exp)+'</div></div></div>';

  h+='<input placeholder="搜商户、商品、分类" value="'+esc(q)+'" oninput="q=this.value;page=0;renderListOnly()" style="margin-bottom:10px">';

  var cats={}; S.recs.forEach(function(r){ if(ym(r.ts)===curMonth&&countable(r,S.opt)) cats[r.cat]=(cats[r.cat]||0)+r.amt; });
  var ks=Object.keys(cats).sort(function(a,b){ return cats[b]-cats[a]; });
  h+='<div class="chips"><button class="'+(selCat==="全部"?"on":"")+'" onclick="selCat=\'全部\';page=0;render()">全部</button>'
    +ks.map(function(c){ return '<button class="'+(selCat===c?"on":"")+'" onclick="selCat=\''+c+'\';page=0;render()">'+esc(c)+'</button>'; }).join("")
    +'</div>';

  h+='<div id="listBody">'+listBody(rows)+'</div>';
  return h;
}
function renderListOnly(){ document.getElementById("listBody").innerHTML=listBody(filtered()); }

function listBody(rows){
  if(!rows.length) return '<div class="empty">这个月没有符合条件的记录</div>';
  var per=60, tot=rows.length, p=Math.min(page,Math.max(0,Math.ceil(tot/per)-1));
  var slice=rows.slice(p*per,p*per+per);
  var h="",lastD="";
  slice.forEach(function(r){
    var d=ymd(r.ts);
    if(d!==lastD){ lastD=d; h+='<div class="dayh"><span>'+d+'</span></div>'; }
    var txt=(r.prod||r.type||r.cp||"—");
    var sub=(r.cp||"")+(r.cp&&r.prod?" · ":"")+(r.prod||"");
    h+='<div class="it" onclick="editCat(\''+encodeURIComponent(r.id)+'\')">'
      +'<div class="ic">'+esc(r.cat.slice(0,2))+'</div>'
      +'<div class="mn"><div class="t1">'+esc(txt)+'</div><div class="t2">'+esc(sub)+' · '+esc(r.src==="wechat"?"微信":"支付宝")+'</div></div>'
      +'<div class="amt '+(r.dir==="expense"?"exp":"inc")+'">'+(r.dir==="expense"?"-":"+")+fmt(r.amt)+'<small>'+esc(r.cat)+'</small></div>'
      +'</div>';
  });
  h+='<div style="display:flex;gap:8px;margin-top:12px">'
    +(p>0?'<button class="btn sec sm" onclick="page='+(p-1)+';renderListOnly()">上一页</button>':'')
    +(slice.length+p*per<tot?'<button class="btn sec sm" onclick="page='+(p+1)+';renderListOnly()">下一页</button>':'')
    +'</div>';
  return h;
}

function editCat(encId){
  var id=decodeURIComponent(encId);
  var r=S.recs.filter(function(x){ return x.id===id; })[0]; if(!r) return;
  var list = r.dir==="income" ? INCOME_CATS : EXPENSE_CATS;
  var m=document.createElement("div"); m.className="mask";
  m.innerHTML='<div class="modal"><div style="font-size:15px;font-weight:600;margin-bottom:3px">'+esc(r.cp||r.prod)+'</div>'
    +'<div class="hint" style="margin-bottom:10px">'+fmt(r.amt)+' 元 · '+ymd(r.ts)+'</div>'
    +'<div class="chips">'+list.map(function(c){
        return '<button class="'+(r.cat===c?"on":"")+'" onclick="setCat(\''+encodeURIComponent(id)+'\',\''+c+'\')">'+c+'</button>';
      }).join("")+'</div>'
    +'<div class="row"><button class="btn gray sm" onclick="document.querySelector(\'.mask\').remove()">关闭</button>'
    +'<button class="btn sec sm" onclick="delRec(\''+encodeURIComponent(id)+'\')">不统计这笔</button></div></div>';
  document.body.appendChild(m);
}
function setCat(encId,c){
  var id=decodeURIComponent(encId);
  S.recs.forEach(function(r){ if(r.id===id){ r.cat=c; r.catLocked=true; } });
  /* 同名商户批量学习 */
  var target=S.recs.filter(function(r){ return r.id===id; })[0];
  if(target && target.cp){
    S.rules=S.rules.filter(function(x){ return x.kw!==target.cp; });
    S.rules.push({cat:c,kw:target.cp});
  }
  save(); document.querySelector(".mask").remove(); render();
  toast("已记住："+target.cp+" → "+c);
}
function delRec(encId){
  var id=decodeURIComponent(encId);
  S.recs=S.recs.filter(function(r){ return r.id!==id; });
  save(); document.querySelector(".mask").remove(); render(); toast("已移除");
}

/* ===================== 统计 ===================== */
function viewStats(){
  if(!S.recs.length) return '<div class="empty">还没有账目</div>';
  var h=mbar();
  var rows=S.recs.filter(function(r){ return ym(r.ts)===curMonth && countable(r,S.opt); });
  var exp=0,inc=0,cnt=0,max=0;
  rows.forEach(function(r){ if(r.dir==="expense"){ exp+=r.amt; cnt++; if(r.amt>max) max=r.amt; } else if(r.dir==="income") inc+=r.amt; });
  var days={}; rows.forEach(function(r){ if(r.dir==="expense") days[ymd(r.ts)]=1; });
  var nd=Object.keys(days).length||1;

  h+='<div class="card"><h2>'+curMonth+' 概览</h2><div class="stat-grid">'
    +'<div><div class="k">支出</div><div class="v exp">'+fmt(exp)+'</div></div>'
    +'<div><div class="k">收入</div><div class="v inc">'+fmt(inc)+'</div></div>'
    +'<div><div class="k">日均支出</div><div class="v">'+fmt(exp/nd)+'</div></div>'
    +'<div><div class="k">最大单笔</div><div class="v">'+fmt(max)+'</div></div>'
    +'<div><div class="k">支出笔数</div><div class="v">'+cnt+'</div></div>'
    +'<div><div class="k">有消费天数</div><div class="v">'+Object.keys(days).length+'</div></div>'
    +'</div></div>';

  var cats={}; rows.forEach(function(r){ if(r.dir==="expense") cats[r.cat]=(cats[r.cat]||0)+r.amt; });
  var ks=Object.keys(cats).sort(function(a,b){ return cats[b]-cats[a]; });
  var top=ks.length?cats[ks[0]]:1;
  h+='<div class="card"><h2>分类排行</h2>';
  if(!ks.length) h+='<div class="hint">这个月没有支出记录</div>';
  ks.forEach(function(c){
    var p=(cats[c]/exp*100)||0;
    h+='<div class="bar"><div class="nm">'+esc(c)+'</div><div class="tr"><div class="fl" style="width:'+Math.max(2,p)+'%"></div></div>'
      +'<div class="vv">'+fmt(cats[c])+' <span style="color:var(--faint)">'+Math.round(p)+'%</span></div></div>';
  });
  h+='</div>';

  h+='<div class="card"><h2>占比</h2><div style="position:relative;height:240px"><canvas id="pie" role="img" aria-label="分类支出占比饼图">支出占比</canvas></div></div>';

  var ms=allMonths().slice(0,6).reverse();
  h+='<div class="card"><h2>近 6 个月趋势</h2><div style="position:relative;height:220px"><canvas id="trend" role="img" aria-label="近六个月收支趋势图">收支趋势</canvas></div></div>';

  h+='<div class="card"><h2>支付方式</h2>';
  var pm={}; rows.forEach(function(r){ if(r.dir==="expense"){ var k=r.method||"未注明"; pm[k]=(pm[k]||0)+r.amt; } });
  var pk=Object.keys(pm).sort(function(a,b){ return pm[b]-pm[a]; }).slice(0,6);
  if(!pk.length) h+='<div class="hint">暂无</div>';
  pk.forEach(function(k){ h+='<div class="list"><span>'+esc(k)+'</span><span>'+fmt(pm[k])+'</span></div>'; });
  h+='</div>';
  window.__pieData={ks:ks,vals:ks.map(function(c){ return Math.round(cats[c]*100)/100; })};
  window.__trendData={ms:ms,exp:ms.map(function(m){ var s=0; S.recs.forEach(function(r){ if(ym(r.ts)===m&&r.dir==="expense"&&countable(r,S.opt)) s+=r.amt; }); return Math.round(s*100)/100; }),
    inc:ms.map(function(m){ var s=0; S.recs.forEach(function(r){ if(ym(r.ts)===m&&r.dir==="income"&&countable(r,S.opt)) s+=r.amt; }); return Math.round(s*100)/100; })};
  return h;
}
var PIE_COLORS=["#2f6bf0","#e0483d","#1f9d55","#c77700","#8b5cf6","#0ea5e9","#ec4899","#14b8a6","#f59e0b","#6366f1","#84cc16","#94a3b8"];
function drawCharts(){
  if(typeof Chart==="undefined") return;
  var pd=window.__pieData, td=window.__trendData;
  if(pd&&pd.ks.length){
    var el=document.getElementById("pie");
    if(el) new Chart(el,{type:"doughnut",data:{labels:pd.ks,datasets:[{data:pd.vals,backgroundColor:PIE_COLORS,borderWidth:0}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},cutout:"58%"}});
    var lg=document.createElement("div");
    lg.style.cssText="display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:12px;color:#8a9099";
    lg.innerHTML=pd.ks.map(function(k,i){ return '<span style="display:flex;align-items:center;gap:4px"><span style="width:9px;height:9px;border-radius:2px;background:'+PIE_COLORS[i%PIE_COLORS.length]+'"></span>'+esc(k)+'</span>'; }).join("");
    el.parentNode.parentNode.appendChild(lg);
  }
  if(td){
    var e2=document.getElementById("trend");
    if(e2) new Chart(e2,{type:"bar",data:{labels:td.ms,datasets:[
      {label:"支出",data:td.exp,backgroundColor:"#e0483d",borderRadius:4},
      {label:"收入",data:td.inc,backgroundColor:"#1f9d55",borderRadius:4}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:{grid:{display:false},ticks:{autoSkip:false,maxRotation:45,font:{size:10}}},y:{grid:{color:"#f0f1f3"},ticks:{font:{size:10}}}}});
  }
}

/* ===================== 设置 ===================== */
function viewSettings(){
  var h="";
  h+='<div class="card"><h2>统计口径</h2>'
    +sw("hideInvalid","排除失败/已关闭的交易","下单没付成、交易关闭的不算账")
    +sw("hideRefund","排除已退款的支出","钱已退回，不该算作花销")
    +sw("hideNeutral","排除提现、充值、还款","只是资金在自己账户间搬家，不是消费")
    +sw("hideTransfer","排除转账和红包","勾选后，转给别人的钱不计入支出")
    +'</div>';

  h+='<div class="card"><h2>AI 兜底分类</h2>'
    +'<div class="hint" style="margin-bottom:10px">规则库认不出的商户，交给大模型判断。只在设置页点一次「补全分类」时才联网，且只发送商户名，不含金额。</div>'
    +'<label class="fld"><span>接口地址（OpenAI 兼容）</span><input id="aBase" placeholder="https://api.deepseek.com/v1" value="'+esc(S.ai.base)+'"></label>'
    +'<label class="fld"><span>API Key</span><input id="aKey" type="password" placeholder="sk-..." value="'+esc(S.ai.key)+'"></label>'
    +'<label class="fld"><span>模型名</span><input id="aModel" placeholder="deepseek-chat" value="'+esc(S.ai.model)+'"></label>'
    +'<button class="btn sec sm" onclick="saveAI()">保存配置</button>'
    +'<div style="height:8px"></div>'
    +'<button class="btn sm" onclick="aiFill()">补全未分类（'+S.recs.filter(function(r){ return r.cat==="其他支出"||r.cat==="其他收入"; }).length+' 笔）</button>'
    +'</div>';

  var other={};
  S.recs.forEach(function(r){ if(r.cat==="其他支出"||r.cat==="其他收入"){ var k=(r.cp||r.prod||"").trim(); if(k) other[k]=(other[k]||0)+1; } });
  var ok=Object.keys(other).sort(function(a,b){ return other[b]-other[a]; }).slice(0,12);
  if(ok.length){
    h+='<div class="card"><h2>没认出来的商户</h2><div class="hint" style="margin-bottom:8px">点一下直接归类，之后同类自动跟着走。</div>';
    ok.forEach(function(k){
      h+='<div class="list"><span>'+esc(k)+' <span class="tag">'+other[k]+' 笔</span></span><span><button class="btn sec sm" style="padding:5px 10px;width:auto;display:inline-block" onclick="quickCat(\''+encodeURIComponent(k)+'\')">归类</button></span></div>';
    });
    h+='</div>';
  }

  if(S.rules.length){
    h+='<div class="card"><h2>我教过的规则（'+S.rules.length+'）</h2>';
    S.rules.slice(-20).reverse().forEach(function(r){
      h+='<div class="list"><span>'+esc(r.kw)+'</span><span style="color:var(--muted);font-size:13px">'+esc(r.cat)+'</span></div>';
    });
    h+='</div>';
  }

  h+='<div class="card"><h2>数据</h2>'
    +'<button class="btn sec sm" style="margin-bottom:8px" onclick="exportCSV()">导出整理好的 CSV</button>'
    +'<button class="btn gray sm" onclick="clearAll()">清空全部账目</button>'
    +'<div class="hint" style="margin-top:10px">数据只存在这台设备的浏览器里，不上传任何服务器。换设备或清缓存会丢，重要的话记得导出。</div></div>';
  return h;
}
function sw(k,lb,ds){
  return '<div class="sw"><div><div class="lb">'+lb+'</div><div class="ds">'+ds+'</div></div>'
    +'<button class="tg '+(S.opt[k]?"on":"")+'" onclick="toggle(\''+k+'\')"><i></i></button></div>';
}
function toggle(k){ S.opt[k]=!S.opt[k]; save(); render(); }
function saveAI(){
  S.ai={base:document.getElementById("aBase").value.trim().replace(/\/+$/,""),
        key:document.getElementById("aKey").value.trim(),
        model:document.getElementById("aModel").value.trim()||"deepseek-chat"};
  save(); toast("已保存");
}
function quickCat(encK){
  var k=decodeURIComponent(encK);
  var m=document.createElement("div"); m.className="mask";
  m.innerHTML='<div class="modal"><div style="font-weight:600;margin-bottom:8px">'+esc(k)+' 归到</div><div class="chips">'
    +EXPENSE_CATS.concat(INCOME_CATS).map(function(c){
      return '<button onclick="applyQuick(\''+encodeURIComponent(k)+'\',\''+c+'\')">'+c+'</button>';
    }).join("")+'</div><button class="btn gray sm" onclick="document.querySelector(\'.mask\').remove()">取消</button></div>';
  document.body.appendChild(m);
}
function applyQuick(encK,c){
  var k=decodeURIComponent(encK);
  S.rules=S.rules.filter(function(x){ return x.kw!==k; });
  S.rules.push({cat:c,kw:k});
  S.recs.forEach(function(r){ if((r.cp||r.prod||"").trim()===k){ r.cat=c; r.catLocked=true; } });
  save(); document.querySelector(".mask").remove(); render(); toast("已记住");
}

function aiFill(){
  if(!S.ai.key||!S.ai.base){ toast("先填写接口地址和 API Key"); return; }
  var set={};
  S.recs.forEach(function(r){
    if(r.cat!=="其他支出"&&r.cat!=="其他收入") return;
    var k=(r.cp||"").trim()+"||"+(r.prod||"").trim();
    if(!set[k]) set[k]={cp:(r.cp||"").trim(),prod:(r.prod||"").trim()};
  });
  var keys=Object.keys(set).slice(0,120);
  if(!keys.length){ toast("没有需要补全的"); return; }
  toast("正在请求模型…");
  var list=keys.map(function(k,i){ return (i+1)+". "+set[k].cp+(set[k].prod?" / "+set[k].prod:""); }).join("\n");
  var prompt="下面是一些中国个人账单里的商户与商品名。请判断每一条最合适的消费分类。\n"
    +"只能从这些分类里选：\n"+EXPENSE_CATS.concat(INCOME_CATS).join("、")+"\n\n"
    +"只返回 JSON 对象，键是序号字符串，值是分类名，不要解释。例如 {\"1\":\"餐饮美食\"}\n\n"+list;
  fetch(S.ai.base+"/chat/completions",{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+S.ai.key},
    body:JSON.stringify({model:S.ai.model,messages:[{role:"user",content:prompt}],temperature:0})
  }).then(function(r){ return r.json(); }).then(function(j){
    var txt=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content||"";
    var m=txt.match(/\{[\s\S]*\}/); if(!m){ toast("模型返回格式不对"); return; }
    var map=JSON.parse(m[0]), n=0;
    keys.forEach(function(k,i){
      var c=map[String(i+1)];
      if(!c||EXPENSE_CATS.concat(INCOME_CATS).indexOf(c)<0) return;
      S.aiMap[set[k].cp||set[k].prod]=c; n++;
      S.recs.forEach(function(r){
        if(r.cat!=="其他支出"&&r.cat!=="其他收入") return;
        if((r.cp||"").trim()===(set[k].cp||"") && (r.prod||"").trim()===(set[k].prod||"")){ r.cat=c; r.catLocked=true; }
      });
    });
    save(); render(); toast("补全了 "+n+" 类商户");
  }).catch(function(e){ toast("请求失败："+(e.message||e)); });
}

function exportCSV(){
  var rows=S.recs.filter(function(r){ return countable(r,S.opt); });
  var head=["日期","分类","收/支","金额","商户","商品","来源","支付方式","状态"];
  var lines=[head.join(",")];
  rows.forEach(function(r){
    lines.push([ymd(r.ts),r.cat,r.dir==="expense"?"支出":"收入",r.amt.toFixed(2),
      r.cp,r.prod,r.src==="wechat"?"微信":"支付宝",r.method,r.status].map(function(v){
        return '"'+String(v==null?"":v).replace(/"/g,'""')+'"';
      }).join(","));
  });
  var blob=new Blob(["\uFEFF"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="账目_"+new Date().toISOString().slice(0,10)+".csv";
  a.click(); toast("已导出 "+rows.length+" 笔");
}
function clearAll(){
  var m=document.createElement("div"); m.className="mask";
  m.innerHTML='<div class="modal"><div style="font-weight:600;margin-bottom:6px">清空全部账目？</div>'
    +'<div class="hint" style="margin-bottom:12px">'+S.recs.length+' 笔记录会被删除，无法恢复。</div>'
    +'<div class="row"><button class="btn sec sm" onclick="document.querySelector(\'.mask\').remove()">取消</button>'
    +'<button class="btn sm" style="background:var(--expense)" onclick="S.recs=[];save();document.querySelector(\'.mask\').remove();go(\'import\')">确认清空</button></div></div>';
  document.body.appendChild(m);
}

/* ===================== 启动 ===================== */
(function(){
  load();
  if(!S.recs.length) cur="import";
  /* 自定义规则优先于内置规则 */
  var orig=hitKeyword;
  hitKeyword=function(t){
    for(var i=S.rules.length-1;i>=0;i--){
      if(t.indexOf(String(S.rules[i].kw).toLowerCase())>=0) return {cat:S.rules[i].cat,kw:S.rules[i].kw};
    }
    return orig(t);
  };
  render();
  var d=document.getElementById("drop");
  if(d){
    d.addEventListener("dragover",function(e){ e.preventDefault(); d.classList.add("on"); });
    d.addEventListener("dragleave",function(){ d.classList.remove("on"); });
    d.addEventListener("drop",function(e){
      e.preventDefault(); d.classList.remove("on");
      onFiles(e.dataTransfer.files);
    });
  }
})();
</script>
</body>
</html>
